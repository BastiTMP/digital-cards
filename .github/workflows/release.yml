name: Build WordPress release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP files
        run: |
          mkdir -p dist
          cd plugins
          zip -qr ../dist/moeller-cards.zip moeller-cards
          zip -qr ../dist/tmp-cards.zip tmp-cards
          zip -qr ../dist/mdex-cards.zip mdex-cards

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v1.0.0"
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "${RELEASE_TAG} exists already; nothing to publish."
              exit 0
            fi
          fi

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            dist/moeller-cards.zip \
            dist/tmp-cards.zip \
            dist/mdex-cards.zip \
            --title "Digital Cards ${RELEASE_TAG}" \
            --generate-notes
